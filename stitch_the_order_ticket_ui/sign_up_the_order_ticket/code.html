<style>
        /* Zigzag cut effect at the top */
        .ticket-cut-top {
            clip-path: polygon(
                0% 12px, 2.5% 0px, 5% 12px, 7.5% 0px, 10% 12px, 12.5% 0px, 15% 12px, 17.5% 0px, 20% 12px, 22.5% 0px, 25% 12px, 27.5% 0px, 30% 12px, 32.5% 0px, 35% 12px, 37.5% 0px, 40% 12px, 42.5% 0px, 45% 12px, 47.5% 0px, 50% 12px, 52.5% 0px, 55% 12px, 57.5% 0px, 60% 12px, 62.5% 0px, 65% 12px, 67.5% 0px, 70% 12px, 72.5% 0px, 75% 12px, 77.5% 0px, 80% 12px, 82.5% 0px, 85% 12px, 87.5% 0px, 90% 12px, 92.5% 0px, 95% 12px, 97.5% 0px, 100% 12px,
                100% 100%, 0% 100%
            );
            /* Add padding top to account for the cut */
            padding-top: 16px; 
        }
        
        .ticket-cut-bottom {
            clip-path: polygon(
                0% 0%, 100% 0%, 100% calc(100% - 12px), 97.5% 100%, 95% calc(100% - 12px), 92.5% 100%, 90% calc(100% - 12px), 87.5% 100%, 85% calc(100% - 12px), 82.5% 100%, 80% calc(100% - 12px), 77.5% 100%, 75% calc(100% - 12px), 72.5% 100%, 70% calc(100% - 12px), 67.5% 100%, 65% calc(100% - 12px), 62.5% 100%, 60% calc(100% - 12px), 57.5% 100%, 55% calc(100% - 12px), 52.5% 100%, 50% calc(100% - 12px), 47.5% 100%, 45% calc(100% - 12px), 42.5% 100%, 40% calc(100% - 12px), 37.5% 100%, 35% calc(100% - 12px), 32.5% 100%, 30% calc(100% - 12px), 27.5% 100%, 25% calc(100% - 12px), 22.5% 100%, 20% calc(100% - 12px), 17.5% 100%, 15% calc(100% - 12px), 12.5% 100%, 10% calc(100% - 12px), 7.5% 100%, 5% calc(100% - 12px), 2.5% 100%, 0% calc(100% - 12px)
            );
             padding-bottom: 24px;
        }

        /* Scissors divider */
        .scissors-divider {
            position: relative;
            text-align: center;
            border-bottom: 1px dashed #7f756f; /* outline color */
            line-height: 0.1em;
            margin: 24px 0;
        }
        .scissors-divider span {
            background: #ffffff; /* surface-container-lowest */
            padding: 0 10px;
            color: #7f756f;
            font-size: 14px;
        }

        /* Custom Input Styling */
        input:focus {
            outline: none;
            border-color: #2b2521 !important; /* primary-container */
            border-width: 2px !important;
            box-shadow: none !important;
        }
    </style>

<body class="bg-surface-container-low min-h-screen flex flex-col items-center justify-center p-4 md:p-8 font-body-md text-on-surface">
<!-- The Top Bar (Suppressed on transactional flow, keeping brand only) -->
<header class="w-full max-w-lg mb-8 flex justify-center">
<h1 class="font-display-xl text-display-xl uppercase tracking-tight text-primary">The Order Ticket</h1>
</header>
<!-- The Ticket Container -->
<main class="w-full max-w-md bg-surface-container-lowest border-x-2 border-outline relative shadow-none ticket-cut-top ticket-cut-bottom flex flex-col">
<!-- Status Tag -->
<div class="absolute top-6 right-0 bg-secondary-container text-on-secondary-container font-label-caps text-label-caps px-4 py-1 border-y-2 border-l-2 border-primary-container z-10">
            NEW ACCOUNT
        </div>
<div class="px-6 md:px-10 pt-12 pb-6 flex-grow">
<form class="flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-1">
<label class="font-data-mono text-data-mono text-on-surface-variant uppercase" for="fullName">Full Name</label>
<input class="w-full border border-outline-variant bg-surface rounded-none px-3 py-2 font-body-md text-on-surface" id="fullName" placeholder="e.g. John Doe" type="text"/>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-1">
<label class="font-data-mono text-data-mono text-on-surface-variant uppercase" for="email">Email Address</label>
<input class="w-full border border-outline-variant bg-surface rounded-none px-3 py-2 font-body-md text-on-surface" id="email" placeholder="e.g. name@kitchen.com" type="email"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-1">
<label class="font-data-mono text-data-mono text-on-surface-variant uppercase" for="phone">Phone Number</label>
<input class="w-full border border-outline-variant bg-surface rounded-none px-3 py-2 font-body-md text-on-surface" id="phone" placeholder="e.g. 555-0198" type="tel"/>
</div>
<div class="scissors-divider">
<span class="material-symbols-outlined text-sm">content_cut</span>
</div>
<!-- Password -->
<div class="flex flex-col gap-1">
<label class="font-data-mono text-data-mono text-on-surface-variant uppercase" for="password">Password</label>
<input class="w-full border border-outline-variant bg-surface rounded-none px-3 py-2 font-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1">
<label class="font-data-mono text-data-mono text-on-surface-variant uppercase" for="confirmPassword">Confirm Password</label>
<input class="w-full border border-outline-variant bg-surface rounded-none px-3 py-2 font-body-md text-on-surface" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
<div class="scissors-divider">
<span class="material-symbols-outlined text-sm">content_cut</span>
</div>
<!-- Address Section -->
<div class="flex flex-col gap-1">
<label class="font-data-mono text-data-mono text-on-surface-variant uppercase flex justify-between items-center" for="address">
                        Delivery Address
                        <button class="flex items-center gap-1 text-primary-container hover:text-secondary underline underline-offset-2 decoration-1 text-xs" type="button">
<span class="material-symbols-outlined text-[16px]">location_on</span> Use current location
                        </button>
</label>
<textarea class="w-full border border-outline-variant bg-surface rounded-none px-3 py-2 font-body-md text-on-surface resize-none" id="address" placeholder="123 Prep St, Unit 4" rows="2"></textarea>
</div>
<!-- Primary Action -->
<button class="mt-6 w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 border-2 border-primary-container uppercase hover:bg-surface-container-lowest hover:text-primary-container transition-colors duration-150 flex items-center justify-center gap-2" type="button">
                    CREATE ACCOUNT <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
</div>
</main>
<!-- Footer Link -->
<footer class="mt-8 text-center">
<a class="font-data-mono text-data-mono text-primary-container underline underline-offset-4 decoration-2 hover:text-secondary transition-colors duration-150" href="#">
            Already have an account? Sign in
        </a>
</footer>
</body></html>
