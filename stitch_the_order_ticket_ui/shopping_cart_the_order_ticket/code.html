<style>
        body {
            background-color: #F6F3EA;
            color: #2B2521;
        }
        
        .receipt-edge {
            clip-path: polygon(0% 0%, 100% 0%, 100% calc(100% - 8px), 98% 100%, 96% calc(100% - 8px), 94% 100%, 92% calc(100% - 8px), 90% 100%, 88% calc(100% - 8px), 86% 100%, 84% calc(100% - 8px), 82% 100%, 80% calc(100% - 8px), 78% 100%, 76% calc(100% - 8px), 74% 100%, 72% calc(100% - 8px), 70% 100%, 68% calc(100% - 8px), 66% 100%, 64% calc(100% - 8px), 62% 100%, 60% calc(100% - 8px), 58% 100%, 56% calc(100% - 8px), 54% 100%, 52% calc(100% - 8px), 50% 100%, 48% calc(100% - 8px), 46% 100%, 44% calc(100% - 8px), 42% 100%, 40% calc(100% - 8px), 38% 100%, 36% calc(100% - 8px), 34% 100%, 32% calc(100% - 8px), 30% 100%, 28% calc(100% - 8px), 26% 100%, 24% calc(100% - 8px), 22% 100%, 20% calc(100% - 8px), 18% 100%, 16% calc(100% - 8px), 14% 100%, 12% calc(100% - 8px), 10% 100%, 8% calc(100% - 8px), 6% 100%, 4% calc(100% - 8px), 2% 100%, 0% calc(100% - 8px));
        }

        .dot-leader {
            border-bottom: 2px dotted #2B2521;
            flex-grow: 1;
            margin: 0 8px;
            position: relative;
            top: -6px;
        }

        .scissors-divider {
            position: relative;
            text-align: center;
            margin: 24px 0;
        }

        .scissors-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 2px dashed #2B2521;
            z-index: 0;
        }

        .scissors-content {
            background-color: white;
            padding: 0 12px;
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .kraft-tag {
            background-color: #E2DBC8;
            border: 2px solid #2B2521;
            position: relative;
            display: inline-block;
        }
        
        .kraft-tag::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 10px solid #2B2521;
        }
        
        .kraft-tag-inner::after {
            content: '';
            position: absolute;
            left: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            background-color: #F6F3EA;
            border-radius: 50%;
            border: 2px solid #2B2521;
            z-index: 2;
        }
    </style>

<body class="font-body-md min-h-screen pb-24 md:pb-0">

<main class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pt-8 pb-16">

<div class="font-data-mono text-data-mono text-primary-container uppercase">TICKET #0042</div>
</header>
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter md:gap-0 relative">

<div class="md:col-span-8 md:pr-gutter md:border-r-2 md:border-primary-container">
<div class="bg-white border-2 border-primary-container receipt-edge pb-12 mb-6">
<div class="p-6">

<div>SERVER: <span class="font-bold">MK</span></div>

</div>
<!-- Items List -->
<div class="space-y-8">
<!-- Item 1 -->

<span class="font-bold">₹840</span>
</div>

<div class="w-10 flex items-center justify-center border-x-2 border-primary-container font-bold bg-white">2</div>
<button class="w-8 flex items-center justify-center hover:bg-primary-container hover:text-white transition-colors"><span class="material-symbols-outlined text-[16px]">add</span></button>
</div>
<button class="font-data-mono text-[12px] text-[#A83A2C] uppercase hover:underline decoration-2 underline-offset-4 font-bold tracking-wider">Remove</button>
</div>
</div>
<!-- Item 2 -->
<div>
<div class="flex justify-between items-end font-data-mono text-data-mono mb-3">
<span class="font-bold">×1 Wood-fired Sourdough</span>
<div class="dot-leader"></div>
<span class="font-bold">₹120</span>
</div>
<div class="flex items-center gap-4 text-primary-container">
<div class="flex border-2 border-primary-container bg-surface-container-low font-data-mono h-8">
<button class="w-8 flex items-center justify-center hover:bg-primary-container hover:text-white transition-colors"><span class="material-symbols-outlined text-[16px]">remove</span></button>
<div class="w-10 flex items-center justify-center border-x-2 border-primary-container font-bold bg-white">1</div>
<button class="w-8 flex items-center justify-center hover:bg-primary-container hover:text-white transition-colors"><span class="material-symbols-outlined text-[16px]">add</span></button>
</div>
<button class="font-data-mono text-[12px] text-[#A83A2C] uppercase hover:underline decoration-2 underline-offset-4 font-bold tracking-wider">Remove</button>
</div>
</div>
</div>
<!-- Divider -->
<div class="scissors-divider">
<div class="scissors-content font-data-mono text-data-mono font-bold text-primary-container">
<span class="material-symbols-outlined text-[18px]">content_cut</span>
                                ORDER TOTALS
                            </div>
</div>
<!-- Cost Breakdown -->
<div class="space-y-3 font-data-mono text-data-mono text-right w-full flex flex-col items-end">
<div class="w-64 flex justify-between">
<span class="text-on-surface-variant">SUBTOTAL</span>
<span>₹960</span>
</div>
<div class="w-64 flex justify-between">
<span class="text-on-surface-variant">DELIVERY FEE</span>
<span>₹50</span>
</div>
<div class="w-64 flex justify-between">
<span class="text-on-surface-variant">TAXES</span>
<span>₹48</span>
</div>
<div class="w-64 flex justify-between border-t-4 border-primary-container pt-3 mt-1 font-bold text-[18px]">
<span>TOTAL</span>
<span>₹1058</span>
</div>
</div>
<!-- Promo Code -->
<div class="mt-8 flex font-data-mono h-12">
<input class="flex-grow border-2 border-primary-container border-r-0 px-4 focus:ring-0 focus:outline-none bg-surface-container-lowest placeholder-outline text-primary-container uppercase" placeholder="ENTER PROMO CODE" type="text"/>

</div>

</div>
<div class="kraft-tag ml-3 self-start">
<div class="kraft-tag-inner px-4 py-2 font-data-mono text-data-mono font-bold text-primary-container uppercase">
                        DELIVERY TIME: 25-35 MINS

</div>
<button class="w-full bg-[#D9A62E] border-2 border-primary-container py-4 mt-auto hover:bg-primary-container hover:text-white transition-colors group flex items-center justify-center gap-2">
<span class="font-headline-md text-headline-md font-bold uppercase tracking-wide">PROCEED TO CHECKOUT</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
