<p class="font-data-mono text-data-mono text-on-surface-variant mt-2">Sep 28, 2023 - 19:42</p>

</div>

</div>
</div>

<div class="w-full border-t border-dashed border-outline-variant my-6"></div>

<div class="mb-8">
<h3 class="font-label-caps text-label-caps font-bold text-on-surface-variant mb-4">STATUS</h3>
<div class="flex flex-col space-y-2">

<div class="flex items-center">
<div class="w-2 h-2 bg-mustard mr-4"></div>
<span class="font-label-caps text-label-caps font-bold text-mustard bg-secondary-fixed/20 px-2 py-1 border border-mustard uppercase">Fired</span>
</div>

<span class="font-label-caps text-label-caps text-outline uppercase">Out for delivery</span>
</div>
